# ── Hotel Media — پیکربندی nginx برای هتل تا ۳۰۰ اتاق ──────────────
#
# چرا nginx و نه php -S:
#   وب‌سرور داخلی PHP تک‌نخی است و هر بار فقط یک درخواست را پردازش می‌کند.
#   اندازه‌گیری روی همین پروژه: ۳۷ درخواست در ثانیه با تاخیر ۵۵۰ms.
#   ۳۰۰ اتاق فقط برای heartbeat به ۱۰ تا ۲۰ درخواست در ثانیه نیاز دارند و
#   یک دانلود ویدیوی بزرگ، کل سرور را تا پایان دانلود قفل می‌کند.
#
# نصب:
#   sudo cp deploy/nginx/hotel-media.conf /etc/nginx/sites-available/hotel-media
#   sudo ln -s /etc/nginx/sites-available/hotel-media /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

upstream hotel_media_php {
    server unix:/run/php/hotel-media.sock;
    keepalive 32;
}

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root  /var/www/hotel-media/public;
    index index.php;

    charset utf-8;

    # آپلود رسانه: ویدیوی تبلیغاتی و فیلم VOD بزرگ‌اند
    client_max_body_size 5G;
    client_body_timeout  300s;

    # لاگ‌ها
    access_log /var/log/nginx/hotel-media.access.log;
    error_log  /var/log/nginx/hotel-media.error.log warn;

    # ── فشرده‌سازی ───────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml font/woff2;
    # ویدیو و تصویر از قبل فشرده‌اند — فشرده‌سازی دوباره فقط CPU می‌سوزاند

    # ── فایل‌های حساس ────────────────────────────────────────────
    location ~ /\.(?!well-known) { deny all; }

    # install.php بعد از نصب باید بسته باشد: رمز دیتابیس را نشان می‌دهد
    # و می‌تواند اسکیما را دوباره اجرا کند. برای اجرای مجدد، این بلاک را
    # موقتا کامنت کنید.
    location = /install.php { deny all; }

    # ── دارایی‌های ثابت ──────────────────────────────────────────
    # فونت و کتابخانه‌های محلی: یک سال کش، چون نامشان با نسخه ثابت است
    location /assets/vendor/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # ── رسانه ────────────────────────────────────────────────────
    # مهم‌ترین بخش برای ۳۰۰ اتاق: ویدیو مستقیم با sendfile از دیسک سرو
    # می‌شود و اصلا وارد PHP نمی‌شود. اگر از PHP رد شود، هر پخش همزمان
    # یک worker را تا پایان ویدیو اشغال می‌کند.
    location /uploads/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;

        sendfile      on;
        tcp_nopush    on;
        aio           threads;
        output_buffers 2 1m;

        try_files $uri =404;
    }

    # پخش HLS ترنسکدر — قطعه‌ها کوتاه‌عمرند
    location /hls/ {
        add_header Cache-Control "no-cache";
        access_log off;
        try_files $uri $uri/ @php;
    }

    # ── مسیر اصلی ────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location @php {
        fastcgi_pass hotel_media_php;
        include      fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    }

    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass    hotel_media_php;
        fastcgi_index   index.php;
        include         fastcgi_params;
        fastcgi_param   SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param   HTTPS $https if_not_empty;

        # همگام‌سازی EPG و آپلود رسانه طولانی‌اند
        fastcgi_read_timeout 300s;

        fastcgi_buffer_size       16k;
        fastcgi_buffers           16 16k;
        fastcgi_keep_conn         on;
    }

    # ── WebSocket ────────────────────────────────────────────────
    # پلیر مستقیم به پورت ۸۰۸۰ وصل می‌شود؛ این proxy برای وقتی است که
    # فقط پورت ۸۰ از فایروال هتل عبور می‌کند.
    location /ws {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
