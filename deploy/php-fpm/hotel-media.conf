; ── Hotel Media — استخر PHP-FPM برای هتل تا ۳۰۰ اتاق ───────────────
;
; نصب:
;   sudo cp deploy/php-fpm/hotel-media.conf /etc/php/8.3/fpm/pool.d/hotel-media.conf
;   sudo rm -f /etc/php/8.3/fpm/pool.d/www.conf
;   sudo systemctl restart php8.3-fpm
;
; اندازه‌گذاری:
;   هر worker حدود ۴۰ تا ۶۰ مگابایت مصرف می‌کند.
;   ۳۲ worker ≈ ۲ گیگابایت رم — روی سرور ۸ گیگابایتی جا دارد.
;   بار واقعی ۳۰۰ اتاق: heartbeat هر ۳۰ ثانیه = ۱۰ req/s، به‌علاوه‌ی
;   بارگذاری پورتال و EPG. هر درخواست حدود ۳۰ms طول می‌کشد، پس ۳۲ worker
;   حدود ۱۰۰۰ req/s ظرفیت می‌دهد — حاشیه‌ی زیاد برای ساعت اوج (ورود گروهی،
;   یا بازگشت برق که همه‌ی تلویزیون‌ها همزمان بوت می‌شوند).

[hotel-media]

user  = www-data
group = www-data

listen       = /run/php/hotel-media.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; صف سوکت: وقتی همه‌ی worker ها مشغولند، درخواست‌ها به‌جای رد شدن صبر
; می‌کنند. بعد از قطعی برق، ۳۰۰ تلویزیون همزمان وصل می‌شوند.
listen.backlog = 1024

; ── مدیریت فرایندها ────────────────────────────────────────────────
; dynamic: در ساعت خلوت رم آزاد می‌شود، در اوج بالا می‌رود
pm                   = dynamic
pm.max_children      = 32
pm.start_servers     = 8
pm.min_spare_servers = 6
pm.max_spare_servers = 16

; نشت حافظه‌ی تدریجی در فرایندهای طولانی‌عمر را خنثی می‌کند
pm.max_requests = 500

; صفحه‌ی وضعیت برای عیب‌یابی — فقط از خود سرور در دسترس است
pm.status_path = /fpm-status
ping.path      = /fpm-ping

; ── لاگ ────────────────────────────────────────────────────────────
access.log = /var/log/php-fpm/hotel-media.access.log
slowlog    = /var/log/php-fpm/hotel-media.slow.log

; هر درخواست کندتر از ۵ ثانیه با stack trace لاگ می‌شود — بهترین ابزار
; برای پیدا کردن کوئری کند وقتی هتل شلوغ است
request_slowlog_timeout = 5s

; سقف امن: درخواست گیرکرده worker را برای همیشه نمی‌گیرد
request_terminate_timeout = 300s

catch_workers_output = yes
php_admin_value[error_log] = /var/log/php-fpm/hotel-media.error.log
php_admin_flag[log_errors] = on

; ── تنظیمات PHP ────────────────────────────────────────────────────
php_admin_value[memory_limit]       = 256M
php_admin_value[upload_max_filesize] = 5G
php_admin_value[post_max_size]       = 5G
php_admin_value[max_execution_time]  = 300
php_admin_value[max_input_time]      = 300

; خطاها هرگز نباید در پاسخ به تلویزیون چاپ شوند
php_admin_flag[display_errors] = off
php_admin_flag[expose_php]     = off

; نشست‌ها داخل پوشه‌ی برنامه می‌مانند تا با بقیه‌ی سایت‌های سرور قاطی نشوند
php_admin_value[session.save_path]     = /var/www/hotel-media/storage/sessions
php_admin_value[session.gc_maxlifetime] = 28800
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.use_strict_mode] = 1

; پوشه‌هایی که PHP اجازه‌ی دسترسی دارد — اگر کدی خواست فایل سیستم را
; بخواند، از این مسیرها فراتر نمی‌رود
php_admin_value[open_basedir] = /var/www/hotel-media:/tmp:/usr/share/php

; OPcache — بدون آن هر درخواست کل کد را دوباره کامپایل می‌کند
php_admin_value[opcache.enable]                  = 1
php_admin_value[opcache.memory_consumption]      = 192
php_admin_value[opcache.interned_strings_buffer] = 16
php_admin_value[opcache.max_accelerated_files]   = 20000
php_admin_value[opcache.validate_timestamps]     = 0
php_admin_value[opcache.revalidate_freq]         = 0
; توجه: با validate_timestamps=0 بعد از هر به‌روزرسانی کد باید
;   sudo systemctl reload php8.3-fpm
; اجرا شود، وگرنه کد قدیمی سرو می‌شود.
